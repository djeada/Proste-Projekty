<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Caesar Cipher</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Caesar Cipher</h1>

      <label for="message">Text</label>
      <textarea id="message" rows="5" placeholder="Type or paste text here"></textarea>

      <div class="controls">
        <label for="key">Key</label>
        <input id="key" type="number" step="1" value="3" />

        <fieldset>
          <legend>Mode</legend>
          <label><input type="radio" name="mode" id="mode-encrypt" value="encrypt" checked /> Encrypt</label>
          <label><input type="radio" name="mode" id="mode-decrypt" value="decrypt" /> Decrypt</label>
        </fieldset>

        <button id="crack" type="button">Crack</button>
      </div>

      <label for="result">Result</label>
      <textarea id="result" rows="5" readonly></textarea>

      <p id="status" role="status"></p>
    </main>

    <script src="caesar_cipher.js"></script>
    <script src="main.js"></script>
  </body>
</html>
