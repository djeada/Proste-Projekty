<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Caesar Cipher</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Caesar Cipher</h1>
      
      <div class="input-group">
        <label for="message">Message:</label>
        <textarea id="message" placeholder="Enter your message here..."></textarea>
      </div>
      
      <div class="controls">
        <div class="input-group">
          <label for="key">Shift (Key):</label>
          <input type="number" id="key" value="3" min="0" max="25" />
        </div>
        
        <div class="input-group">
          <label for="mode">Mode:</label>
          <select id="mode">
            <option value="encrypt">Encrypt</option>
            <option value="decrypt">Decrypt</option>
          </select>
        </div>
      </div>
      
      <button id="run" class="run-btn">Run</button>
      
      <div class="input-group">
        <label for="result">Result:</label>
        <textarea id="result" readonly placeholder="Result will appear here..."></textarea>
      </div>
      
      <button id="copy" class="copy-btn">Copy to Clipboard</button>
    </div>
    <script src="app.js"></script>
  </body>
</html>
