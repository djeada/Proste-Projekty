<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spinning Donut</title>
<style>
  body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; left: 16px; bottom: 12px; color: #3f3; font: 15px monospace; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="hud"></div>
<script>
// A spinning 3D torus: rotation, perspective, surface normals and depth sorting.
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const RING = 100, TUBE = 60;  // segments around the torus and around its tube
let w, h, sA, cA, sB, cB, frames = 0;

const resize = () => {
  const dpr = devicePixelRatio || 1;
  w = innerWidth;
  h = innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
};
addEventListener('resize', resize);
resize();

// sweep the circle point (x, y) around the y axis by i, then rotate by A and B
const rotate = (x, y, i) => {
  const si = Math.sin(i), ci = Math.cos(i);
  const z = si * x * sA + y * cA, t = si * x * cA - y * sA;
  return [ci * x * cB - t * sB, ci * x * sB + t * cB, z];
};

const project = (a, b, size) => {
  const j = b / TUBE * 2 * Math.PI;
  const [x, y, z] = rotate(Math.cos(j) + 2, Math.sin(j), a / RING * 2 * Math.PI);
  return [w / 2 + size * x / (z + 5), h / 2 + size * y / (z + 5)];
};

const frame = now => {
  sA = Math.sin(now * 0.0021); cA = Math.cos(now * 0.0021);
  sB = Math.sin(now * 0.0009); cB = Math.cos(now * 0.0009);
  const size = Math.min(w, h) * 0.5, faces = [];

  for (let a = 0; a < RING; a++) {
    for (let b = 0; b < TUBE; b++) {
      const i = (a + 0.5) / RING * 2 * Math.PI, j = (b + 0.5) / TUBE * 2 * Math.PI;
      const [x, y, z] = rotate(Math.cos(j) + 2, Math.sin(j), i);
      const [nx, ny, nz] = rotate(Math.cos(j), Math.sin(j), i);  // surface normal
      if (nx * x + ny * y + nz * (z + 5) > 0) continue;  // facing away from us
      const light = Math.max(0, -ny - nz) / Math.SQRT2;  // light comes from above, behind us
      faces.push({ a, b, z, light });
    }
  }
  faces.sort((p, q) => q.z - p.z);  // painter's algorithm: far faces first

  ctx.clearRect(0, 0, w, h);
  for (const { a, b, light } of faces) {
    ctx.beginPath();
    for (const [da, db] of [[0, 0], [1, 0], [1, 1], [0, 1]]) {
      ctx.lineTo(...project(a + da, b + db, size));
    }
    ctx.fillStyle = ctx.strokeStyle = `hsl(120, 100%, ${5 + 80 * light ** 1.3}%)`;
    ctx.fill();
    ctx.stroke();
  }
  hud.textContent = `[+] ${++frames} frames rendered. no WebGL needed.`;
  requestAnimationFrame(frame);
};
requestAnimationFrame(frame);
</script>
</body>
</html>
