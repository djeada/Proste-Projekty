<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doom Fire</title>
<style>
  body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #hud { position: fixed; left: 16px; bottom: 12px; color: #f33; font: bold 15px monospace; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="hud"></div>
<script>
// The PSX Doom fire: heat rises, drifts sideways and cools at random.
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const PIXELS = 60000, MAX_HEAT = 80;
const STEP = 1000 / 60;            // one simulation step every 16.7 ms
const BURN = 6000, CYCLE = 10000;  // burn for 6 s, die out, then light it again
let w, h, heat, image, pixels;

const resize = () => {
  const scale = Math.max(1, Math.sqrt(innerWidth * innerHeight / PIXELS));
  w = canvas.width = Math.ceil(innerWidth / scale);
  h = canvas.height = Math.ceil(innerHeight / scale);
  heat = new Uint8Array(w * h);
  image = ctx.createImageData(w, h);
  pixels = new Uint32Array(image.data.buffer);  // one 0xAABBGGRR number per pixel
};
addEventListener('resize', resize);
resize();

// black, dark red, red, orange, yellow, white
const clamp = v => Math.max(0, Math.min(255, v));
const palette = Array.from({ length: MAX_HEAT + 1 }, (_, i) => {
  const t = i / MAX_HEAT;
  return 0xff000000 | clamp(1020 * t - 765) << 16 | clamp(510 * t - 170) << 8 | clamp(400 * t);
});

const step = (fuel, time) => {
  for (let x = 0; x < w; x++) {  // the bottom row feeds the fire, hotter in some places
    const wave = Math.sin(x * 0.11 + time * 0.002) * Math.sin(x * 0.043 - time * 0.0013);
    heat[(h - 1) * w + x] = MAX_HEAT * fuel * (0.7 + 0.3 * wave);
  }
  for (let x = 0; x < w; x++) {
    for (let y = 1; y < h; y++) {
      const src = y * w + x, r = Math.round(Math.random() * 3) & 3;
      if (!heat[src]) heat[src - w] = 0;
      else heat[src - w - r + 1] = heat[src] - (r & 1);  // drift with the wind, maybe cool
    }
  }
};

let last, lag = 0, clock = 0;
const frame = now => {
  lag += Math.min(now - (last ?? now), 250);
  last = now;
  for (; lag >= STEP; lag -= STEP, clock += STEP) {
    const t = clock % CYCLE;
    step(Math.max(0, Math.min(1, (BURN - t) / 1500)), clock);
  }
  for (let i = 0; i < heat.length; i++) pixels[i] = palette[heat[i]];
  ctx.putImageData(image, 0, 0);
  hud.textContent = clock % CYCLE > BURN + 1500 ? '[+] fire extinguished' : '';
  requestAnimationFrame(frame);
};
requestAnimationFrame(frame);
</script>
</body>
</html>
