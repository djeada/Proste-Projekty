<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandelbrot Zoom</title>
<style>
  body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #hud {
    position: fixed; left: 12px; bottom: 12px; padding: 4px 8px;
    background: #000b; color: #fff; font: 15px monospace;
  }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="hud"></div>
<script>
// Deep zoom into the Mandelbrot set's "seahorse valley", one pixel at a time.
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const PIXELS = 70000;  // drawn at low resolution, the browser scales it up
const CX = -0.743643887037151, CY = 0.131825904205330;
const ZOOM_TIME = 10;  // seconds until we start over
let w, h, image, pixels, start;

const resize = () => {
  const scale = Math.max(1, Math.sqrt(innerWidth * innerHeight / PIXELS));
  w = canvas.width = Math.ceil(innerWidth / scale);
  h = canvas.height = Math.ceil(innerHeight / scale);
  image = ctx.createImageData(w, h);
  pixels = new Uint32Array(image.data.buffer);  // one 0xAABBGGRR number per pixel
};
addEventListener('resize', resize);
resize();

// blue, cyan, white, yellow, orange, red, magenta, purple, blended into 1024 colors
const STOPS = [[0, 0, 255], [0, 255, 255], [255, 255, 255], [255, 255, 0],
               [255, 128, 0], [255, 0, 0], [255, 0, 255], [128, 0, 255]];
const palette = new Uint32Array(1024).map((_, i) => {
  const s = i / 128, from = STOPS[Math.floor(s)], to = STOPS[Math.ceil(s) % 8];
  const [r, g, b] = from.map((c, k) => c + (to[k] - c) * (s % 1));
  return 0xff000000 | b << 16 | g << 8 | r;
});

const frame = now => {
  start ??= now;
  const t = (now - start) / 1000 % ZOOM_TIME;
  const zoom = Math.exp(t * 1.1), maxIter = Math.round(100 + t * 70);
  const step = 3.2 / zoom / Math.min(w, h);

  for (let y = 0, i = 0; y < h; y++) {
    const im = CY + (y - h / 2) * step;
    for (let x = 0; x < w; x++, i++) {
      const re = CX + (x - w / 2) * step;
      let zr = 0, zi = 0, n = 0;
      while (zr * zr + zi * zi < 256 && n < maxIter) {
        const tmp = zr * zr - zi * zi + re;
        zi = 2 * zr * zi + im;
        zr = tmp;
        n++;
      }
      // a fractional escape count gives smooth color bands instead of steps
      const smooth = n + 1 - Math.log2(Math.log2(zr * zr + zi * zi) / 2);
      pixels[i] = n === maxIter ? 0xff000000 : palette[Math.sqrt(smooth) * 96 + t * 160 & 1023];
    }
  }
  ctx.putImageData(image, 0, 0);
  hud.textContent = `zoom ${Math.round(zoom)}x | ${maxIter} iterations`;
  requestAnimationFrame(frame);
};
requestAnimationFrame(frame);
</script>
</body>
</html>
