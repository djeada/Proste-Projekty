<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maze Solver</title>
<style>
  body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; left: 16px; bottom: 10px; color: #ff3; font: bold 16px monospace; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="hud"></div>
<script>
// Carve a random maze with depth-first search, then solve it with BFS.
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const CELL = 14, CARVE = 4000, FLOOD = 3000, WALK = 1500, CYCLE = 11000;  // px, ms
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
let w, h, cols, rows, offsetX, offsetY, carvedAt, carveOrder, dist, path, start, prevT = Infinity;

const grid = value => Array.from({ length: rows }, () => new Array(cols).fill(value));
const odd = n => (n - 1) | 1;  // the largest odd number <= n

const newMaze = () => {
  const dpr = devicePixelRatio || 1;
  w = innerWidth;
  h = innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cols = odd(Math.floor(w / CELL));
  rows = odd(Math.floor((h - 40) / CELL));
  offsetX = (w - cols * CELL) / 2;
  offsetY = (h - 40 - rows * CELL) / 2;

  // carve with depth-first search, remembering when each cell was opened
  carvedAt = grid(Infinity);
  carvedAt[1][1] = 0;
  carveOrder = [[1, 1]];
  const stack = [[1, 1]];
  while (stack.length) {
    const [x, y] = stack.at(-1);
    const next = DIRS.map(([dx, dy]) => [x + 2 * dx, y + 2 * dy]).filter(([nx, ny]) =>
      nx > 0 && ny > 0 && nx < cols - 1 && ny < rows - 1 && carvedAt[ny][nx] === Infinity);
    if (!next.length) { stack.pop(); continue; }  // dead end: backtrack
    const [nx, ny] = next[Math.floor(Math.random() * next.length)];
    carvedAt[(y + ny) / 2][(x + nx) / 2] = carvedAt[ny][nx] = carveOrder.length;
    carveOrder.push([nx, ny]);
    stack.push([nx, ny]);
  }

  // solve with breadth-first search: dist is the number of steps from the start
  dist = grid(-1);
  dist[1][1] = 0;
  const from = grid(null), queue = [[1, 1]];
  for (const [x, y] of queue) {  // the queue grows while we walk through it
    if (x === cols - 2 && y === rows - 2) break;
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy;
      if (carvedAt[ny][nx] === Infinity || dist[ny][nx] >= 0) continue;  // wall or seen
      dist[ny][nx] = dist[y][x] + 1;
      from[ny][nx] = [x, y];
      queue.push([nx, ny]);
    }
  }
  path = [];
  for (let p = [cols - 2, rows - 2]; p; p = from[p[1]][p[0]]) path.push(p);  // walk back
};
addEventListener('resize', newMaze);

const progress = (t, from, length) => Math.max(0, Math.min(1, (t - from) / length));
const ripple = d => `hsl(${240 - 60 * Math.cos(d / 8)}, 100%, 50%)`;  // cyan, blue, magenta

const cell = (x, y, color) => {
  ctx.fillStyle = color;
  ctx.fillRect(offsetX + x * CELL, offsetY + y * CELL, CELL, CELL);
};

const draw = t => {
  const carved = progress(t, 0, CARVE) * carveOrder.length;
  const front = progress(t, CARVE + 400, FLOOD) * dist[rows - 2][cols - 2];
  const walked = progress(t, CARVE + 400 + FLOOD, WALK) * path.length;

  ctx.clearRect(0, 0, w, h);
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const d = dist[y][x];
      if (carvedAt[y][x] >= carved) cell(x, y, '#444');  // still a wall
      else if (d >= 0 && d <= front) cell(x, y, ripple(front - d));
    }
  }
  path.slice(0, walked).forEach(([x, y]) => cell(x, y, '#ff0'));
  if (carved < carveOrder.length) cell(...carveOrder[Math.floor(carved)], '#f0f');  // DFS head
  cell(1, 1, '#0f0');
  cell(cols - 2, rows - 2, '#f00');
  hud.textContent = walked === path.length ? `[+] shortest path: ${path.length - 1} steps` : '';
};

const frame = now => {
  start ??= now;
  const t = (now - start) % CYCLE;
  if (t < prevT) newMaze();  // the clock wrapped around: start over
  prevT = t;
  draw(t);
  requestAnimationFrame(frame);
};
requestAnimationFrame(frame);
</script>
</body>
</html>
