<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plasma</title>
<style>
  body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; left: 12px; bottom: 12px; padding: 4px 8px;
    background: #000b; color: #f5f; font: bold 15px monospace;
  }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="hud"></div>
<script>
// Demoscene plasma: four sine waves mixed into a color field, pixel by pixel.
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const PIXELS = 100000;  // drawn at low resolution, the browser scales it up smoothly
let w, h, image, pixels, frames = 0;

const resize = () => {
  const scale = Math.max(1, Math.sqrt(innerWidth * innerHeight / PIXELS));
  w = canvas.width = Math.ceil(innerWidth / scale);
  h = canvas.height = Math.ceil(innerHeight / scale);
  image = ctx.createImageData(w, h);
  pixels = new Uint32Array(image.data.buffer);  // one 0xAABBGGRR number per pixel
};
addEventListener('resize', resize);
resize();

// 256 colors: red, green and blue sine waves, a third of a turn apart
const palette = new Uint32Array(256).map((_, i) => {
  const [r, g, b] = [0, 2.094, 4.189].map(p => 128 + 127 * Math.sin(i / 256 * 2 * Math.PI + p));
  return 0xff000000 | b << 16 | g << 8 | r;
});

const frame = now => {
  const t = now * 0.0021;  // 0.07 per frame at 30 fps, like the C version
  const k = 100 / Math.min(w, h);  // as if the short side were 100 terminal cells

  for (let y = 0, i = 0; y < h; y++) {
    const py = (y - h / 2) * k;
    for (let x = 0; x < w; x++, i++) {
      const px = (x - w / 2) * k;
      const v = Math.sin(px * 0.16 + t)
              + Math.sin(py * 0.13 - t * 1.3)
              + Math.sin((px + py) * 0.11 + t * 0.7)
              + Math.sin(Math.sqrt(px * px + py * py) * 0.18 - t * 1.6);
      const hue = v * 1.3 + t * 0.5;
      pixels[i] = palette[hue / (2 * Math.PI) * 256 & 255];
    }
  }
  ctx.putImageData(image, 0, 0);
  hud.textContent = `[+] ${++frames} frames of plasma, zero textures`;
  requestAnimationFrame(frame);
};
requestAnimationFrame(frame);
</script>
</body>
</html>
