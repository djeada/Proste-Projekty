<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quicksort Visualizer</title>
<style>
  body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script>
// Quicksort, visualized: every swap is a frame.
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const N = 120, PAUSE = 600, SORT = 7000, SWEEP = 1000, CYCLE = 10000;  // milliseconds
const a = Array.from({ length: N }, (_, i) => i + 1);
let w, h, compares, swaps, frames, start, prevT = Infinity;

const resize = () => {
  const dpr = devicePixelRatio || 1;
  w = innerWidth;
  h = innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
};
addEventListener('resize', resize);
resize();

const snapshot = (marks = []) => ({ bars: [...a], marks, compares, swaps });

const swap = (i, j, pivot) => {
  [a[i], a[j]] = [a[j], a[i]];
  swaps++;
  return snapshot([i, j, pivot]);
};

// Lomuto partitioning; the generator yields one frame per swap
function* quicksort(lo, hi) {
  if (lo >= hi) return;
  const p = a[hi];
  let i = lo;
  for (let j = lo; j < hi; j++) {
    compares++;
    if (a[j] < p) yield swap(i++, j, hi);
  }
  yield swap(i, hi, i);
  yield* quicksort(lo, i - 1);
  yield* quicksort(i + 1, hi);
}

const shuffleAndSort = () => {
  for (let i = N - 1; i > 0; i--) {  // Fisher-Yates shuffle
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  compares = swaps = 0;
  frames = [snapshot(), ...quicksort(0, N - 1), snapshot()];
};

const draw = ({ bars, marks: [x1, x2, pivot], compares, swaps }, done) => {
  const size = Math.min(20, w / 24), bw = w / N, unit = (h - size * 4) / N;
  ctx.clearRect(0, 0, w, h);
  bars.forEach((v, i) => {
    ctx.fillStyle = i < done ? '#0f0'
      : i === pivot ? '#f0f'
      : i === x1 || i === x2 ? '#fff'
      : `hsl(${(v - 1) / N * 260}, 100%, 55%)`;
    ctx.fillRect(i * bw, h - v * unit, bw * 0.8, v * unit);
  });
  ctx.fillStyle = '#ddd';
  ctx.font = `${size}px monospace`;
  ctx.fillText(`quicksort | compares ${compares} | swaps ${swaps}`, size, size * 2);
};

const frame = now => {
  start ??= now;
  const t = (now - start) % CYCLE;
  if (t < prevT) shuffleAndSort();  // the clock wrapped around: start over
  prevT = t;
  const k = Math.floor((t - PAUSE) / SORT * frames.length);
  const done = Math.floor((t - PAUSE - SORT) / SWEEP * N);  // the victory sweep
  draw(frames[Math.max(0, Math.min(frames.length - 1, k))], done);
  requestAnimationFrame(frame);
};
requestAnimationFrame(frame);
</script>
</body>
</html>
