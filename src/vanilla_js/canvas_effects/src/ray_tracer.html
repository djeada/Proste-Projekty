<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ray Tracer</title>
<style>
  body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #hud {
    position: fixed; left: 12px; bottom: 12px; padding: 4px 8px;
    background: #000b; color: #5ff; font: bold 15px monospace;
  }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="hud"></div>
<script>
// A tiny ray tracer: a reflective sphere, a checkered floor, soft lighting
// and hard shadows, with the light orbiting the scene.
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const PIXELS = 60000;  // rays per frame; the browser scales the image up
let w, h, image, light, frames = 0;

const resize = () => {
  const scale = Math.max(1, Math.sqrt(innerWidth * innerHeight / PIXELS));
  w = canvas.width = Math.ceil(innerWidth / scale);
  h = canvas.height = Math.ceil(innerHeight / scale);
  image = ctx.createImageData(w, h);
};
addEventListener('resize', resize);
resize();

const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const norm = a => mul(a, 1 / Math.sqrt(dot(a, a)));

const CENTER = [0, 0, 4], FOG = [20, 30, 60];

const hitSphere = (o, d) => {
  const oc = sub(o, CENTER), b = dot(oc, d);
  const disc = b * b - dot(oc, oc) + 1;
  if (disc < 0) return -1;
  const t = -b - Math.sqrt(disc);
  return t > 1e-3 ? t : -1;
};

const trace = (o, d, depth) => {
  const ts = hitSphere(o, d), tp = d[1] < 0 ? (-1 - o[1]) / d[1] : -1;
  if (ts < 0 && tp < 0) return [20, 30 + 40 * d[1], 60 + 120 * d[1]];  // sky
  if (ts > 0 && (tp < 0 || ts < tp)) {
    const p = add(o, mul(d, ts)), n = norm(sub(p, CENTER)), l = norm(sub(light, p));
    const r = sub(d, mul(n, 2 * dot(d, n)));
    const spec = 255 * Math.max(0, dot(r, l)) ** 30;
    let color = mul([255, 60, 100], 0.15 + 0.85 * Math.max(0, dot(n, l)));
    if (depth < 2) color = add(mul(color, 0.7), mul(trace(p, r, depth + 1), 0.3));
    return add(color, [spec, spec, spec]);
  }
  const p = add(o, mul(d, tp)), l = norm(sub(light, p));
  const check = (Math.floor(p[0]) + Math.floor(p[2])) & 1;
  let shade = 0.25 + 0.75 * Math.max(0, l[1]);
  if (hitSphere(p, l) > 0) shade *= 0.3;  // shadow
  const fog = Math.exp(-0.06 * tp);
  return add(mul(check ? [230, 230, 230] : [40, 40, 60], shade * fog), mul(FOG, 1 - fog));
};

const frame = now => {
  const a = now * 0.0018;  // 0.06 per frame at 30 fps, like the C version
  light = [5 * Math.cos(a), 3 + Math.sin(a * 0.7), 1.5 + 2.5 * Math.sin(a)];
  const s = Math.min(w, h) / 2;

  for (let y = 0, i = 0; y < h; y++) {
    for (let x = 0; x < w; x++, i += 4) {
      const [r, g, b] = trace([0, 0.3, 0], norm([(x - w / 2) / s, (h / 2 - y) / s - 0.15, 1.4]), 0);
      image.data.set([r, g, b, 255], i);  // values above 255 are clamped
    }
  }
  ctx.putImageData(image, 0, 0);
  hud.textContent = `[+] ${++frames} frames ray traced on the CPU`;
  requestAnimationFrame(frame);
};
requestAnimationFrame(frame);
</script>
</body>
</html>
