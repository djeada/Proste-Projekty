<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warp Starfield</title>
<style>
  body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; left: 12px; bottom: 12px; padding: 4px 8px;
    background: #000c; color: #ccc; font: 15px monospace;
  }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="hud"></div>
<script>
// A 3D starfield accelerating to warp speed, with motion streaks.
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const STARS = 900, WARP = 8000, CYCLE = 10500;  // accelerate for 8 s, then arrive
// color and line width by depth: near stars are white and thick, far ones gray and thin
const LAYERS = [['#fff', 3], ['#d7ffff', 2.2], ['#afd7ff', 1.6], ['#888', 1]];
let w, h, stars, last, start, prevT = Infinity;

const resize = () => {
  const dpr = devicePixelRatio || 1;
  w = innerWidth;
  h = innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
};
addEventListener('resize', resize);
resize();

const spawn = z => ({ x: Math.random() * 2 - 1, y: Math.random() * 2 - 1, z });
const project = (s, z) => [w / 2 + s.x / z * w * 0.35, h / 2 + s.y / z * w * 0.35];

const frame = now => {
  start ??= now;
  const t = (now - start) % CYCLE, dt = Math.min(now - (last ?? now), 100) / 1000;
  last = now;
  if (t < prevT) stars = Array.from({ length: STARS }, () => spawn(0.05 + Math.random()));
  prevT = t;

  const p = Math.min(1, t / WARP);
  const speed = 0.12 + 1.05 * p * p;      // depth units per second
  const trail = 0.3 * speed * speed;     // streaks grow with speed
  ctx.clearRect(0, 0, w, h);
  ctx.lineCap = 'round';

  for (const s of stars) {
    s.z -= speed * dt;
    if (s.z < 0.02) Object.assign(s, spawn(1.05));
  }
  for (let layer = LAYERS.length - 1; layer >= 0; layer--) {  // far stars first
    ctx.beginPath();
    for (const s of stars) {
      if (Math.min(3, Math.floor(s.z * 4)) !== layer) continue;
      ctx.moveTo(...project(s, s.z + trail));
      ctx.lineTo(...project(s, s.z));
    }
    [ctx.strokeStyle, ctx.lineWidth] = LAYERS[layer];
    ctx.stroke();
  }

  if (t > WARP) {  // drop out of warp: a white flash, then the arrival message
    const flash = 1 - (t - WARP) / 600;
    if (flash > 0) {
      ctx.fillStyle = `rgba(255, 255, 255, ${flash})`;
      ctx.fillRect(0, 0, w, h);
    } else {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#5ff';
      ctx.font = `bold ${Math.min(28, w / 20)}px monospace`;
      ctx.textAlign = 'center';
      ctx.fillText('[+] arrived at Alpha Centauri', w / 2, h / 2);
    }
  }
  hud.textContent = t > WARP ? '' : `warp factor ${(1 + 8.9 * p * p).toFixed(1)}`;
  requestAnimationFrame(frame);
};
requestAnimationFrame(frame);
</script>
</body>
</html>
