<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minesweeper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Minesweeper</h1>
    <div class="toolbar">
      <select id="level" aria-label="Level">
        <option value="beginner">Beginner (9x9, 10 mines)</option>
        <option value="intermediate">Intermediate (16x16, 40 mines)</option>
        <option value="expert">Expert (16x30, 99 mines)</option>
      </select>
      <button id="new-game" type="button">New game</button>
    </div>
    <p id="info"></p>
    <div class="board-wrap">
      <div id="board"></div>
    </div>
    <p id="message" role="status"></p>
    <p class="help">Left click: reveal. Right click: flag.</p>
  </main>
  <script src="minesweeper.js"></script>
  <script src="main.js"></script>
</body>
</html>
