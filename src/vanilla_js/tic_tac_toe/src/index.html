<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Tic Tac Toe</h1>
      
      <div class="mode-selector">
        <button id="two-players" class="mode-btn active">Two Players</button>
        <button id="vs-computer" class="mode-btn">vs Computer</button>
      </div>
      
      <div class="scoreboard">
        <div class="score">
          <span class="player-label">Player X</span>
          <span id="score-x" class="score-value">0</span>
        </div>
        <div class="score">
          <span class="player-label">Draws</span>
          <span id="score-draw" class="score-value">0</span>
        </div>
        <div class="score">
          <span class="player-label">Player O</span>
          <span id="score-o" class="score-value">0</span>
        </div>
      </div>
      
      <div id="message" class="message">Player X's turn</div>
      
      <div id="board" class="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>
      
      <div class="buttons">
        <button id="new-game" class="btn">New Game</button>
        <button id="reset-scores" class="btn secondary">Reset Scores</button>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
